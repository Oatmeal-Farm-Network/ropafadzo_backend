name: Deploy Livestock Development

on:
  push:
    branches: ['GCP/backend-development']
    paths:
      - 'livestock/**'
      - 'app/routers/livestock.py'
      - 'app/routers/marketplace.py'
      - 'app/routers/ranches.py'
      - 'app/routers/animals.py'
      - 'app/routers/herd_health.py'
      - 'app/routers/auth.py'
      - 'app/models/livestock.py'
      - 'app/database.py'
      - 'app/routers/translation.py'
      - 'requirements.txt'
      - '.github/workflows/deploy-livestock-testing.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.DEVELOPMENT_GCP_PROJECT_ID || secrets.STAGING_GCP_PROJECT_ID || 'oatmeal-farm-staging' }}
  REGION: ${{ vars.DEVELOPMENT_REGION || vars.STAGING_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.DEVELOPMENT_ARTIFACT_REGISTRY_REPOSITORY || vars.STAGING_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: oatmeal-livestock-development
  IMAGE_NAME: livestock
  CLOUD_SQL_INSTANCE: ${{ vars.DEVELOPMENT_CLOUD_SQL_INSTANCE || vars.STAGING_CLOUD_SQL_INSTANCE || 'oatmeal-farm-staging:us-central1:oatmeal-staging-sqlserver' }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.DEVELOPMENT_BACKEND_RUNTIME_SA || vars.STAGING_BACKEND_RUNTIME_SA || 'stg-to-prod-db-ro-dev-project@oatmeal-farm-staging.iam.gserviceaccount.com' }}
  DEVELOPMENT_LOA_FRONTEND_URL: ${{ vars.DEVELOPMENT_LOA_FRONTEND_URL || vars.STAGING_LOA_FRONTEND_URL || 'https://livestock-frontend-staging-lrviw4iujq-uc.a.run.app' }}
  DEVELOPMENT_FRONTEND_URL: ${{ vars.DEVELOPMENT_FRONTEND_URL || vars.STAGING_FRONTEND_URL || '' }}

jobs:
  check-development-wif:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check development or staging WIF
        id: check
        shell: bash
        run: |
          provider="${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER }}${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          sa="${{ secrets.DEVELOPMENT_GCP_SERVICE_ACCOUNT }}${{ secrets.STAGING_GCP_SERVICE_ACCOUNT }}"
          if [ -n "$provider" ] && [ -n "$sa" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DEVELOPMENT_* or STAGING_* WIF secrets. Skipping livestock testing deploy."
          fi

  deploy:
    needs: check-development-wif
    if: needs.check-development-wif.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Guard development project
        shell: bash
        run: |
          if [ "${PROJECT_ID}" = "animated-flare-421518" ]; then
            echo "::error::Livestock testing must use oatmeal-farm-staging. Never animated-flare-421518 (Oatmeal AI)."
            exit 1
          fi

      - name: Derive commit SHA tag
        shell: bash
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build FRONTEND_URL (LOA required, OFN optional)
        shell: bash
        run: |
          loa="${{ env.DEVELOPMENT_LOA_FRONTEND_URL }}"
          ofn="${{ env.DEVELOPMENT_FRONTEND_URL }}"
          loa="${loa%/}"
          ofn="${ofn%/}"
          if [ -n "$ofn" ] && [ "$ofn" != "$loa" ]; then
            echo "FRONTEND_URL_VALUE=${loa},${ofn}" >> "$GITHUB_ENV"
          else
            echo "FRONTEND_URL_VALUE=${loa}" >> "$GITHUB_ENV"
          fi
          echo "CORS FRONTEND_URL will be: $(grep FRONTEND_URL_VALUE "$GITHUB_ENV" | cut -d= -f2-)"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEVELOPMENT_GCP_SERVICE_ACCOUNT || secrets.STAGING_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          docker build -f livestock/Dockerfile.backend \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Deploy to Cloud Run (testing)
        run: |
          extra=()
          if [ -n "${RUNTIME_SERVICE_ACCOUNT}" ]; then
            extra+=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          fi
          if [ -n "${CLOUD_SQL_INSTANCE}" ]; then
            extra+=(--set-cloudsql-instances "${CLOUD_SQL_INSTANCE}")
          fi
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --update-secrets "DB_SERVER=DB_SERVER:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest,SECRET_KEY=SECRET_KEY:latest" \
            --update-env-vars "INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE},FRONTEND_URL=${FRONTEND_URL_VALUE},LOA_FRONTEND_URL=${DEVELOPMENT_LOA_FRONTEND_URL},GCS_LIVESTOCK_IMAGES_BUCKET=oatmeal-farm-network-images,GCS_IMAGES_BUCKET=oatmeal-farm-network-images,GOOGLE_CLOUD_PROJECT=${PROJECT_ID}" \
            "${extra[@]}" \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
