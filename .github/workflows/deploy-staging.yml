name: Deploy to Staging

# Staging-only CD workflow. Do NOT add production deployment steps here.
# Triggers on pushes to GCP/backend-staging (dedicated staging deploy branch).
# Docs-only pushes under docs/ do not deploy (paths-ignore).
on:
  push:
    branches: ['GCP/backend-staging']
    paths-ignore:
      - 'docs/**'
      - 'README.md'

env:
  GCP_PROJECT_ID: ${{ secrets.STAGING_GCP_PROJECT_ID }}
  REGION: us-central1
  IMAGE_URI_PREFIX: us-central1-docker.pkg.dev/oatmeal-farm-staging/oatmeal-farm-registry/backend
  CLOUD_RUN_SERVICE: oatmeal-backend-staging
  CLOUD_SQL_INSTANCE: oatmeal-farm-staging:us-central1:oatmeal-staging-sqlserver
  RUNTIME_SERVICE_ACCOUNT: stg-to-prod-db-ro-dev-project@oatmeal-farm-staging.iam.gserviceaccount.com
  # Password-reset / email links; override via repo variable STAGING_FRONTEND_URL if needed
  STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL || 'https://oatmeal-frontend-staging-1087130530284.us-central1.run.app' }}

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # AUTH: Workload Identity Federation (keyless)
      # GitHub secret name must match: STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER
      - name: Authenticate to Google Cloud (Staging)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.STAGING_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t "${{ env.IMAGE_URI_PREFIX }}:${{ steps.vars.outputs.sha_short }}" .

      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE_URI_PREFIX }}:${{ steps.vars.outputs.sha_short }}"

      # Staging backend only — do not load server_all/Saige (Saige has its own CD).
      - name: Deploy to Cloud Run (staging)
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "${{ env.IMAGE_URI_PREFIX }}:${{ steps.vars.outputs.sha_short }}" \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --service-account "${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances "${{ env.CLOUD_SQL_INSTANCE }}" \
            --command=uvicorn \
            --args=app.main:app,--host,0.0.0.0,--port,8080 \
            --update-secrets=DB_SERVER=DB_SERVER:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest,SECRET_KEY=SECRET_KEY:latest \
            --update-env-vars=SKIP_SCHEMA_ENSURE=false,INSTANCE_CONNECTION_NAME=${{ env.CLOUD_SQL_INSTANCE }},FRONTEND_URL=${{ env.STAGING_FRONTEND_URL }},GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},FIRESTORE_DATABASE=charlie,GCS_IMAGES_BUCKET=oatmeal-farm-network-images-staging,GCS_LIVESTOCK_IMAGES_BUCKET=oatmeal-farm-network-images,BIOMASS_GCS_BUCKET=oatmeal-farm-network-images-staging \
            --min-instances=1 \
            --quiet

      - name: Print deployed URL
        run: |
          gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)"
