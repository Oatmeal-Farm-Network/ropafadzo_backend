name: Smoke Tests

on:
  pull_request:
    branches:
      - epic/backend-reorg

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest fastapi httpx

      - name: Run smoke tests
        run: pytest test/SmokeTest/precision_ag_smoke.py test/SmokeTest/land_leasing_smoke.py test/SmokeTest/food_wanted_smoke.py test/SmokeTest/livestock_knowledgebase_smoke.py --verbose