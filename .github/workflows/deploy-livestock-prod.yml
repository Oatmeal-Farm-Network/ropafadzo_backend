name: Deploy Livestock Production

# main → livestock-backend-prod in animated-flare-421518 (Oatmeal AI).
# Source of truth is oatmealfarmnetworkbackend/livestock (not LivestockOfAmericabackend).
# Image-only promote (keep existing env/SQL/SA on the service). Never uses staging project.
on:
  push:
    branches: [main]
    paths:
      - 'livestock/**'
      - 'app/routers/livestock.py'
      - 'app/routers/marketplace.py'
      - 'app/routers/ranches.py'
      - 'app/routers/animals.py'
      - 'app/routers/herd_health.py'
      - 'app/routers/auth.py'
      - 'app/routers/businesses.py'
      - 'app/routers/business_photos.py'
      - 'app/routers/services.py'
      - 'app/routers/platform_subscriptions.py'
      - 'app/routers/translation.py'
      - 'app/models/livestock.py'
      - 'app/database.py'
      - 'app/core/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-livestock-prod.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.PROD_GCP_PROJECT_ID || 'animated-flare-421518' }}
  REGION: ${{ vars.PROD_REGION || 'us-central1' }}
  # Match the live prod image path used by the previous LOA backend CD.
  GAR_REPOSITORY: ${{ vars.PROD_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: livestock-backend-prod
  IMAGE_NAME: livestock-backend

jobs:
  check-prod-wif:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check prod WIF secrets
        id: check
        shell: bash
        run: |
          provider="${{ secrets.PROD_GCP_WIF_PROVIDER }}${{ secrets.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          sa="${{ secrets.PROD_GCP_SERVICE_ACCOUNT }}"
          if [ -n "$provider" ] && [ -n "$sa" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Prod WIF is not configured. Skipping livestock production deploy."
          fi

  deploy:
    needs: check-prod-wif
    if: needs.check-prod-wif.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require Oatmeal AI project and livestock entrypoint
        shell: bash
        run: |
          project="${{ env.PROJECT_ID }}"
          if [ "$project" != "animated-flare-421518" ]; then
            echo "::error::Livestock prod must use animated-flare-421518 (Oatmeal AI). Got: $project"
            exit 1
          fi
          if [ ! -f livestock/Dockerfile.backend ] || [ ! -f livestock/api.py ]; then
            echo "::error::livestock/Dockerfile.backend and livestock/api.py are required on main."
            exit 1
          fi

      - name: Set short commit SHA
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.PROD_GCP_WIF_PROVIDER || secrets.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.PROD_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image from livestock/
        run: |
          docker build -f livestock/Dockerfile.backend \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:latest"

      - name: Deploy image to livestock-backend-prod
        run: |
          # Image-only: preserve existing env vars, Cloud SQL, and runtime SA on the service.
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --quiet

      - name: Print deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format="value(status.url)"
