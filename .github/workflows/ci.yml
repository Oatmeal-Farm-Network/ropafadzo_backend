name: CI

# CI gate for every hop: feature → staging → testing → main.
on:
  pull_request:
    branches:
      - 'GCP/backend-staging'
      - 'GCP/backend-testing'
      - 'GCP/backend-development'
      - main

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Critical rules only (see ruff.toml). Full style debt is not a merge blocker.
      - name: Lint app/, saige/, livestock/, and oatsense/
        run: ruff check app saige livestock oatsense

  boot-check:
    name: Boot check (server_all.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r saige/requirements.txt

      - name: Boot server_all.py and probe /health
        env:
          PORT: "8000"
          # Saige imports initialize the Gemini client at module load; CI has no real key.
          GOOGLE_API_KEY: "ci-boot-check-dummy"
          REDIS_ENABLED: "false"
        run: |
          set -o pipefail
          python server_all.py > /tmp/server_all.log 2>&1 &
          SERVER_PID=$!
          sleep 15
          if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
            echo "boot OK"
            RESULT=0
          else
            echo "boot/health check FAILED — server_all log:"
            cat /tmp/server_all.log || true
            RESULT=1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          exit $RESULT

  boot-check-saige:
    name: Boot check (saige service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r saige/requirements.txt

      # Run from saige/ so repo-root app/ does not shadow saige/app (uvicorn app.api).
      - name: Boot saige service and probe /health
        working-directory: saige
        env:
          PORT: "8000"
          PYTHONPATH: .
          GOOGLE_API_KEY: "ci-boot-check-dummy"
          REDIS_ENABLED: "false"
        run: |
          uvicorn app.api:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 12
          if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
            echo "saige boot OK"
            RESULT=0
          else
            echo "saige boot/health check FAILED"
            RESULT=1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          exit $RESULT

  boot-check-livestock:
    name: Boot check (livestock service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Boot livestock service and probe /health
        env:
          PORT: "8000"
        run: |
          uvicorn livestock.api:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          # livestock mounts the LOA workspace routers, several of which (the
          # event_* family) still touch the DB at import, so boot takes longer
          # than a fixed sleep allows. Poll instead, up to 90s.
          for _ in $(seq 1 90); do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
            echo "livestock boot OK"
            RESULT=0
          else
            echo "livestock boot/health check FAILED"
            RESULT=1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          exit $RESULT

  boot-check-oatsense:
    name: Boot check (oatsense service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Boot oatsense service and probe /health
        env:
          PORT: "8000"
        run: |
          uvicorn oatsense.api:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 8
          if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
            echo "oatsense boot OK"
            RESULT=0
          else
            echo "oatsense boot/health check FAILED"
            RESULT=1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          exit $RESULT
