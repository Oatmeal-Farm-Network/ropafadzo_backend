name: Deploy Saige Testing

on:
  # RETIRED_NO_PUSH: testing CD replaced by deploy-development
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.TESTING_GCP_PROJECT_ID || secrets.STAGING_GCP_PROJECT_ID || 'oatmeal-farm-staging' }}
  REGION: ${{ vars.TESTING_REGION || vars.STAGING_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.TESTING_ARTIFACT_REGISTRY_REPOSITORY || vars.STAGING_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: oatmeal-saige-testing
  IMAGE_NAME: saige
  CLOUD_SQL_INSTANCE: ${{ vars.TESTING_CLOUD_SQL_INSTANCE || vars.STAGING_CLOUD_SQL_INSTANCE || 'oatmeal-farm-staging:us-central1:oatmeal-staging-sqlserver' }}

jobs:
  check-testing-wif:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check testing or staging WIF
        id: check
        shell: bash
        run: |
          provider="${{ secrets.TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER }}${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          sa="${{ secrets.TESTING_GCP_SERVICE_ACCOUNT }}${{ secrets.STAGING_GCP_SERVICE_ACCOUNT }}"
          if [ -n "$provider" ] && [ -n "$sa" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No TESTING_* or STAGING_* WIF secrets. Skipping Saige testing deploy."
          fi

  deploy:
    needs: check-testing-wif
    if: needs.check-testing-wif.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Guard testing project
        shell: bash
        run: |
          if [ "${PROJECT_ID}" = "animated-flare-421518" ]; then
            echo "::error::Saige testing must use oatmeal-farm-staging. Never animated-flare-421518 (Oatmeal AI)."
            exit 1
          fi

      - name: Derive commit SHA tag
        shell: bash
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TESTING_GCP_SERVICE_ACCOUNT || secrets.STAGING_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          docker build -f saige/Dockerfile.backend \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            ./saige

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Deploy to Cloud Run (testing)
        run: |
          extra=()
          if [ -n "${CLOUD_SQL_INSTANCE}" ]; then
            extra+=(--set-cloudsql-instances "${CLOUD_SQL_INSTANCE}")
          fi
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 10 \
            --service-account "saige-sa@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},GOOGLE_GENAI_USE_VERTEXAI=true,VERTEX_AI_MODEL=gemini-2.5-flash-lite,GEMINI_MODEL=gemini-2.5-flash-lite,SAIGE_LLM_PROVIDER=gemini,FIRESTORE_DATABASE=${{ vars.TESTING_FIRESTORE_DATABASE || vars.STAGING_FIRESTORE_DATABASE || 'charlie' }},CHAT_HISTORY_DATABASE=${{ vars.TESTING_CHAT_HISTORY_DATABASE || vars.STAGING_CHAT_HISTORY_DATABASE || 'chat-history' }},REDIS_ENABLED=false,REDIS_ALLOW_MEMORY_FALLBACK=true,RAG_HYBRID_ENABLED=true,RAG_RERANK_ENABLED=true,RAG_CACHE_ENABLED=true,ALLOW_ALL_ORIGINS=true,FRONTEND_URL=${{ vars.TESTING_FRONTEND_URL || vars.STAGING_FRONTEND_URL || 'https://oatmeal-frontend-staging-1087130530284.us-central1.run.app' }},OFN_BACKEND_URL=${{ vars.TESTING_BACKEND_URL || vars.STAGING_BACKEND_URL || 'https://oatmeal-backend-staging-1087130530284.us-central1.run.app' }},INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE}" \
            --set-secrets "SECRET_KEY=SECRET_KEY:latest,CRON_SECRET=CRON_SECRET:latest,DB_SERVER=DB_SERVER:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest" \
            "${extra[@]}"

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
